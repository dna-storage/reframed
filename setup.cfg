[tool:pytest]
testpaths = tests
addopts = --tb=short

[flake8]
max-line-length = 120
ignore = E501,W503,E402
per-file-ignores =
    dnastorage/arch/builder.py: F401,F403,F405
    dnastorage/codec/*.py: F401,F403,F405
    dnastorage/system/*.py: F401,F403,F405
    dnastorage/fi/*.py: F401,F403,F405
    tools/*.py: F401,F403,F405
